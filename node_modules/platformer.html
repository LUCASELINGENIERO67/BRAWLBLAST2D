<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Platformer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #87CEEB, #98D8E8);
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        #gameContainer {
            position: relative;
            border: 3px solid #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        
        canvas {
            display: block;
            background: linear-gradient(to bottom, #5C94FC, #8DD5FC);
        }
        
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            color: white;
            font-size: 14px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            text-align: center;
            display: none;
        }
        
        #startScreen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            text-align: center;
        }
        
        #levelSelector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            text-align: center;
            display: none;
        }
        
        .levelButtons {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-top: 30px;
        }
        
        .levelButton {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 20px;
            font-size: 24px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            width: 80px;
            height: 80px;
        }
        
        #worldMap {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.7);
            text-align: center;
            display: none;
        }
        
        .worldMapContainer {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 30px;
            margin-top: 20px;
        }
        
        .worldMapGrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin: 20px 0;
        }
        
        .worldLevel {
            background: #4CAF50;
            border: none;
            color: white;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            width: 100px;
            height: 100px;
            position: relative;
        }
        
        .worldLevel:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.4);
        }
        
        .worldLevel.completed {
            background: #FFD700;
        }
        
        .worldLevel.locked {
            background: #666;
            cursor: not-allowed;
        }
        
        .pathLine {
            position: absolute;
            background: #FFD700;
            height: 3px;
            top: 50%;
            transform: translateY(-50%);
        }
        
        .button {
            background: #FF6B6B;
            border: none;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        .button:hover {
            background: #FF5252;
            transform: translateY(-2px);
            box-shadow: 0 6px 8px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="ui">
            <div>Score: <span id="score">0</span></div>
            <div>Lives: <span id="lives">3</span></div>
            <div>Level: <span id="level">1</span></div>
            <div>Coins: <span id="coinCount">0</span></div>
        </div>
        <div id="controls">
            Use Arrow Keys to Move | Shift to Run | Space to Jump | R to Restart
        </div>
        <div id="gameOver">
            <div id="gameOverText">Game Over!</div>
            <button class="button" onclick="restartGame()">Play Again</button>
        </div>
        <div id="startScreen">
            <div>Super Platformer</div>
            <button class="button" onclick="showLevelSelector()">Start Game</button>
            <button class="button" onclick="openLevelEditor()" style="background: #9b59b6;">Level Editor</button>
        </div>
        <div id="levelSelector">
            <div>Select Level</div>
            <div class="levelButtons">
                <button class="levelButton" onclick="startLevel(1)">1</button>
                <button class="levelButton" onclick="startLevel(2)">2</button>
                <button class="levelButton" onclick="startLevel(3)">3</button>
                <button class="levelButton" onclick="startLevel(4)">4</button>
                <button class="levelButton" onclick="startLevel(5)">5</button>
                <button class="levelButton" onclick="startLevel(6)">6</button>
                <button class="levelButton" onclick="startLevel(7)">7</button>
                <button class="levelButton" onclick="startLevel(8)">8</button>
                <button class="levelButton" onclick="startLevel(9)">9</button>
                <button class="levelButton" onclick="startLevel(10)">10</button>
                <button class="levelButton" onclick="startLevel(11)">2-1</button>
                <button class="levelButton" onclick="startLevel(12)">2-2</button>
                <button class="levelButton" onclick="startLevel(13)">3-1</button>
                <button class="levelButton" onclick="startLevel(14)">3-2</button>
                <button class="levelButton" onclick="startLevel(15)">3-3</button>
            </div>
            <button class="button" onclick="unlockAllLevels()" style="margin-top: 10px; background: #FFD700;">Unlock All Levels</button>
            <button class="button" onclick="showStartScreen()" style="margin-top: 20px;">Back</button>
            <button class="button" onclick="showWorldMap()" style="margin-top: 10px;">World Map</button>
        </div>
        <div id="worldMap">
            <div>World Map</div>
            <div class="worldMapContainer">
                <div class="worldMapGrid">
                    <button class="worldLevel" onclick="startLevel(1)" id="worldLevel1">1-1</button>
                    <button class="worldLevel" onclick="startLevel(2)" id="worldLevel2">1-2</button>
                    <button class="worldLevel" onclick="startLevel(3)" id="worldLevel3">1-3</button>
                    <button class="worldLevel" onclick="startLevel(4)" id="worldLevel4">1-4</button>
                    <button class="worldLevel" onclick="startLevel(5)" id="worldLevel5">1-5</button>
                    <button class="worldLevel" onclick="startLevel(6)" id="worldLevel6">1-6</button>
                    <button class="worldLevel" onclick="startLevel(7)" id="worldLevel7">1-7</button>
                    <button class="worldLevel" onclick="startLevel(8)" id="worldLevel8">1-8</button>
                    <button class="worldLevel" onclick="startLevel(9)" id="worldLevel9">1-9</button>
                    <button class="worldLevel" onclick="startLevel(10)" id="worldLevel10">1-10</button>
                    <button class="worldLevel" onclick="startLevel(11)" id="worldLevel11">2-1</button>
                    <button class="worldLevel" onclick="startLevel(12)" id="worldLevel12">2-2</button>
                    <button class="worldLevel" onclick="startLevel(13)" id="worldLevel13">3-1</button>
                    <button class="worldLevel" onclick="startLevel(14)" id="worldLevel14">3-2</button>
                    <button class="worldLevel" onclick="startLevel(15)" id="worldLevel15">3-3</button>
                </div>
                <div style="color: #FFD700; margin-top: 15px;">Complete levels to unlock the next!</div>
            </div>
            <button class="button" onclick="showLevelSelector()" style="margin-top: 20px;">Back</button>
        </div>
    </div>
    
    <!-- Custom Popup -->
    <div id="customPopup" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0, 0, 0, 0.9); color: white; padding: 30px; border-radius: 10px; text-align: center; z-index: 1000; border: 3px solid #FFD700; min-width: 300px;">
        <div id="popupTitle" style="font-size: 24px; font-weight: bold; margin-bottom: 15px; color: #FFD700;"></div>
        <div id="popupMessage" style="font-size: 16px; margin-bottom: 20px;"></div>
        <button class="button" onclick="closePopup()" style="background: #FFD700; color: black; font-weight: bold;">OK</button>
    </div>
    
    <!-- Level Editor -->
    <div id="levelEditor" style="display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #1a1a2e;">
        <div style="padding: 20px; background: #16213e; border-bottom: 2px solid #0f3460;">
            <h2 style="color: #FFD700; margin: 0 0 15px 0;">Level Editor</h2>
            <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                <button class="button" onclick="selectTool('platform')" style="background: #4a90d9;">Platform</button>
                <button class="button" onclick="selectTool('breakable')" style="background: #e74c3c;">Breakable</button>
                <button class="button" onclick="selectTool('interrogation')" style="background: #f39c12;">?</button>
                <button class="button" onclick="selectTool('goomba')" style="background: #8b4513;">Goomba</button>
                <button class="button" onclick="selectTool('koopa')" style="background: #228b22;">Koopa</button>
                <button class="button" onclick="selectTool('coin')" style="background: #ffd700;">Coin</button>
                <button class="button" onclick="selectTool('pipe')" style="background: #2ecc71;">Pipe</button>
                <button class="button" onclick="selectTool('flagpole')" style="background: #9b59b6;">Flagpole</button>
                <button class="button" onclick="selectTool('playerstart')" style="background: #ff69b4;">Player Start</button>
                <button class="button" onclick="selectTool('erase')" style="background: #e74c3c;">Erase</button>
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="button" onclick="saveLevel()" style="background: #27ae60;">Save Level</button>
                <button class="button" onclick="loadLevel()" style="background: #3498db;">Load Level</button>
                <button class="button" onclick="playTestLevel()" style="background: #f39c12;">Play Test</button>
                <button class="button" onclick="exitEditor()" style="background: #e74c3c;">Exit Editor</button>
            </div>
            <div style="margin-top: 15px; color: white;">
                <span>Current Tool: </span><span id="currentTool" style="color: #FFD700; font-weight: bold;">platform</span>
            </div>
        </div>
        <canvas id="editorCanvas" width="800" height="600" style="background: #87CEEB; cursor: crosshair;"></canvas>
    </div>
    
    <!-- Pause Overlay -->
    <div id="pauseOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: 900;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white;">
            <div style="font-size: 48px; font-weight: bold; color: #FFD700; margin-bottom: 20px;">PAUSED</div>
            <div style="font-size: 18px; margin-bottom: 30px;">Press ESC to resume</div>
            <button class="button" onclick="togglePause()" style="background: #FFD700; color: black; font-weight: bold;">Resume</button>
        </div>
    </div>
    
    <script src="platformer.js"></script>
</body>
</html>
